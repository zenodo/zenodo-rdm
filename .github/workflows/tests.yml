name: CI

on:
  push:
    branches:
      - master
      - "feature/*"
  pull_request:
    branches:
      - master
      - "feature/*"
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason"
        required: false
        default: "Manual trigger"

jobs:
  Python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
          python-version: ["3.14"]
          db-service: [postgresql14]
          search-service: [opensearch2]
    env:
      DB: ${{ matrix.db-service }}
      SEARCH: ${{ matrix.search-service }}
      EXTRAS: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Docker images
        # We're using the fork by AndreKurait, which has bumped the "cache" action
        uses: AndreKurait/docker-cache@0.7.1
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('docker-services.yml') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          activate-environment: true

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@1ce68138bcf3516fd4f5d12f07e37ae016ee30c0  # v1.6.3
        with:
          packages: libkrb5-dev libvips-dev

      - name: Install Python dependencies
        run: |
          uv sync --locked
          uv pip list

      - name: Run tests
        working-directory: ./site
        run: ./run-tests.sh

  JS:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.18.0
          runtime: node@24
          cache: true
          cache-dependency-path: site/package.json
          install: false

      - name: Run eslint
        run: ./run-js-linter.sh
