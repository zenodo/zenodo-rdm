[project]
name = "zenodo-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for the Zenodo REST API."
readme = "README.md"
authors = [
    { name = "CERN" }
]
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
tests = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
zenodo-mcp = "zenodo_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zenodo_mcp"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = ["--doctest-modules"]
testpaths = ["tests", "zenodo_mcp"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
